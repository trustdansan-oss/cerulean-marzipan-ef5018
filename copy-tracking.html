<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Copy tracking code | National Way Delivery Logistics</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f1f5fa;color:#10233d;font-family:Arial,Helvetica,sans-serif}.card{width:min(520px,100%);padding:28px 22px;background:#fff;border:1px solid #dce5f0;border-radius:20px;box-shadow:0 18px 48px #10233d18;text-align:center}.brand{font-weight:900;letter-spacing:.06em;color:#0b3f80}.code{margin:22px 0;padding:18px 12px;background:#f2f7ff;border:2px dashed #0b5cff;border-radius:12px;font-size:clamp(20px,5vw,30px);font-weight:900;overflow-wrap:anywhere;user-select:all}.copy{border:0;border-radius:9px;background:#ffd43b;color:#10233d;padding:13px 20px;font-weight:900;font-size:16px;cursor:pointer}.hint{min-height:25px;margin-top:14px;font-weight:700;color:#08784e}.manual{display:block;margin-top:12px;color:#31567e;font-size:13px}a{color:#0b5cff}
</style></head><body><main class="card"><div class="brand">NATIONAL WAY DELIVERY LOGISTICS</div><h1>Copy your tracking code</h1><p>Tap the yellow button to copy the code, then paste it into the tracking field.</p><div id="code" class="code" aria-label="Tracking code">Tracking code not provided</div><button class="copy" id="copyButton" type="button">Copy tracking code</button><div class="hint" id="result" role="status" aria-live="polite"></div><span class="manual">If copying is blocked by your browser, press and hold the code above to select and copy it.</span><p><a href="./index.html">Return to National Way Delivery Logistics</a></p></main><script>
(function(){const params=new URLSearchParams(location.search);const value=(params.get('code')||'').trim().slice(0,100);const code=document.getElementById('code'),result=document.getElementById('result'),button=document.getElementById('copyButton');if(value){code.textContent=value;}else{code.textContent='No tracking code was supplied.';button.disabled=true;button.style.opacity='.55';}button.addEventListener('click',async()=>{if(!value)return;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);}else{const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('copy blocked');}result.textContent='Copied successfully';button.textContent='Copied successfully';}catch(e){result.textContent='Copy was blocked. Press and hold the code above to copy it manually.';}});})();
</script></body></html>
